        function setPrivLanguage(lang) {
            const data = privTranslations[lang] || privTranslations.en;
            document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : lang;
            document.getElementById('priv-page-title').textContent = data.page_title;
            document.getElementById('priv-meta-desc').setAttribute('content', data.meta_desc);
            document.getElementById('priv-back').textContent = data.back_link;
            document.getElementById('priv-content').innerHTML = data.html;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                if (btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            try {
                localStorage.setItem('gridsnag_lang', lang);
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            let preferredLang = 'en';
            try {
                const stored = localStorage.getItem('gridsnag_lang');
                if (stored && privTranslations[stored]) {
                    preferredLang = stored;
                } else {
                    const browserLang = (navigator.language || '').toLowerCase();
                    if (browserLang.startsWith('zh')) preferredLang = 'zh';
                    else if (browserLang.startsWith('ja')) preferredLang = 'ja';
                    else if (browserLang.startsWith('ko')) preferredLang = 'ko';
                    else if (browserLang.startsWith('de')) preferredLang = 'de';
                    else preferredLang = 'en';
                }
            } catch (e) {}

            setPrivLanguage(preferredLang);

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const lang = e.target.getAttribute('data-lang');
                    setPrivLanguage(lang);
                });
            });
        });
